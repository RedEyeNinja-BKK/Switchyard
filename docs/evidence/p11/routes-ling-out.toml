# These are per-model direct routes on Stephen's own Google AI Studio key
# (llm_client google_gemini_stephen / google_gemma_31b_stephen,
# api_key_env SWITCHYARD_GEMINI_STEPHEN_API_KEY, quota group
# google-ai-studio-free-stephen). They are NOT the OpenRouter Stephen routes
# (direct-openrouter-stephen-*) and NOT the owner-credential Google routes
# (direct-google-*).
#
# Capability flags are copied from each model's owner-side route, so a model
# declares the same tool/vision/video/reasoning support on either account.
# The 2.5 pair is absent, not held: its routes and targets were removed on
# 2026-11-23 by owner order.
# ---------------------------------------------------------------------------

[routes."direct-google-stephen-gemini-3-flash-preview"]
id = "direct-google-stephen-gemini-3-flash-preview"
type = "passthrough"
target = "stephen-google-gemini-3-flash-preview"
candidates = []
context_window = 1048576
tool_calling = true
reasoning = false
vision = false
video = false

