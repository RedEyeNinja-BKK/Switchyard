# ---------------------------------------------------------------------
# VC_Paid — cost-aware selection, then credentialed failover
# ---------------------------------------------------------------------
#
# `vc-paid-core` uses Switchyard's native `auto` algorithm, which is a
# stage_router preset (picker = efficient_first, confidence 0.5). It starts on
# the cheap DeepSeek Flash leg and promotes to V4 Pro only when the scored
# tool-result signals say the cheap leg is not converging, holding the capable
# tier afterwards when configured. That is a real selection mechanism with
# deterministic limits — not an ordered candidate list wearing a new name.
#
# It is NOT OpenRouter's `openrouter/auto`: both legs are fixed DeepSeek models
# on the owner's own credential, so nothing here can reach an arbitrary model or
# a third-party paid account.
#
# Known limit, stated plainly: the stage router scores tool-result signals. It
# does not model tokens, price or task outcome, and this deployment emits no
# per-request cost metric, so "cost per completed task" cannot be measured — it
# can only be approximated by buying the cheap leg first.


# =====================================================================
# GEMINI FREE TIER — bounded lane R1 (release candidate, append-only)
# =====================================================================
# This section is additive: every table above is byte-identical to the
# deployed manifest (sha256 20b77869…, 42 targets / 47 routes). Nothing
# existing changes meaning, so replacing this file is reversible by
# restoring those bytes.
#
# WHAT IS AND IS NOT CLAIMED
#
#   Claimed: the tables parse, every name resolves, and load-time
#   validation accepts them (dry-run receipt attached to the release).
#
#   NOT claimed: any dispatch behaviour on real Gemini traffic. Passing
#   --dry-run proves configuration, not routing. Fallback order, 429
#   handling and quota admission are exercised offline
#   against a mock provider only. The first real Google request is a
#   post-release observation, not a precondition.
# =====================================================================

# ---------------------------------------------------------------------
# Client: Google AI Studio, OpenAI-compatible surface
# ---------------------------------------------------------------------
# This fork has no native Google wire format (openai_chat,
# openai_responses, anthropic_messages only), so the OpenAI-compatible
# endpoint is the only path. It was exercised in the R0 work.
#
# Traffic on the free tier may be used to improve Google's products.
# That is a property of the provider, not of one model, and it is
# recorded as an operational fact: this deployment carries no client-side
# payload-clearance gate, so the acceptance is the owner's, made once.
#
# max_retries = 0: a retry is a second request against a daily budget
# this deployment cannot observe. One attempt, one reservation.
[llm_clients.google_gemini]
format = "openai_chat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
locality = "external"
api_key_env = "SWITCHYARD_GEMINI_API_KEY"
# One AI Studio project serves both models below; naming the group lets a
# second client on the same project share the counter instead of each
# believing it owns the whole budget.
quota_group = "google-ai-studio-free"
max_retries = 0

# ---------------------------------------------------------------------
# Targets: only models with a qualified serving receipt
# ---------------------------------------------------------------------
# vision = false and video = false are both stated rather than omitted:
# omission means "undeclared" for vision, and a text-only lane should say
# what it is instead of relying on a default.
#
# daily_request_limit is the owner-supplied request-per-day BUDGET for
# this model on this project. It is not a balance: nothing here can
# observe how many requests Google has already counted today, and the
# counter file records basis = "local_budget" so no reader mistakes it
# for a remaining quota.
#
# No reasoning_policy is declared. Gemini's thinking cannot be turned off
# on this family (thinkingBudget 0 is 2.5-only, and 2.5-flash-lite 404s on
# generateContent in this project), so claiming "disabled" would be
# false and sending a disable instruction would be refused upstream.
# Google's OpenAI-compatibility surface requires a provider-issued `thought_signature` on
# the first replayed `functionCall` part of every step and answers 400 INVALID_ARGUMENT
# without one. A call another model issued has no signature to send, and Google documents
# exactly that case: `skip_thought_signature_validator` is accepted in its place, at a stated
# cost in context fidelity. Declaring it here is what lets a reply carrying another
# provider's tool lineage be served by a Gemini target instead of being skipped; a call that
# does carry its own signature is echoed verbatim, so the stand-in is only ever used where
# there is nothing real to send.
tool_signature_placeholder = "skip_thought_signature_validator"

[targets."direct-google-gemini-3.5-flash-lite"]
tool_calling = true
# Measured on the twin of this model (stephen-google-gemini-3.5-flash-lite): a replayed
# tool call without its Google thought_signature is refused 400, and a signature cannot be
# manufactured. The client now declares Google's documented stand-in for a call another
# model issued, so replay is servable and the declaration reads true: a foreign call is
# replayed with `skip_thought_signature_validator`, a call carrying its own signature is
# echoed verbatim. Definitional tool calls are unaffected either way.
tool_call_replay = true
id = "gemini-3.5-flash-lite"
llm_client = "google_gemini"
# The Google OpenAI-compatibility surface rejects three Responses-format fields as
# unknown (`Unknown name "store": Cannot find field`, HTTP 400 INVALID_ARGUMENT),
# and an existing Responses client sends `store: false` on every call. Dropping
# them is what lets a Responses caller reach a Gemini chat target at all; the
# provider supplies its own defaults for all three.
omit_body_fields = ["store", "metadata", "prompt_cache_key"]
# `none` is not a value this surface accepts: it answers 400
# INVALID_ARGUMENT while minimal, low, medium and high are all served.
# Dropping it here is the last word on effort, after every override.
unsupported_reasoning_effort = ["none"]
vision = false
video = false
daily_request_limit = 500
# Capacity and admission are two different numbers and both are stated here.
# The window is the model's: 1,048,576 tokens. The ceiling is the project's free-tier
# allowance of 250,000 tokens per minute -- a single request larger than the minute is
# one the provider cannot complete, so it is refused locally instead of being charged.
context_window = 1048576
max_input_tokens = 250000
# A selection fact: requests served here cost nothing inside the allowance, so no metered
# leg may be ordered ahead of this one. Without it the router could only use declared order.
free_tier = true

# Second and last eligible Gemini leg. Included on the owner's explicit
# directive, at position 2. Its measured record is not clean — a 503, a
# JSON grader miss, a >90s timeout and a 24.5s tool-result retry — so it
# sits behind 3.5 and any failure of those classes crosses onward rather
# than being retried in place. Scheduled for 2027-05-07 retirement.
# The free-tier row: 15 requests and 250,000 input tokens a minute, 500 a day.
# A burst is what actually spends a day, so the minute is declared.
requests_per_minute = 15
input_tokens_per_minute = 250000

# Pool membership label. A route that names this group compares the group before it
# compares any leaf; the label is the manifest's only record of which pool a leaf serves.
groups = ["smart-gemini-bounded"]

[targets."direct-google-gemini-3.1-flash-lite"]
tool_calling = true
tool_call_replay = true
id = "gemini-3.1-flash-lite"
llm_client = "google_gemini"
# The Google OpenAI-compatibility surface rejects three Responses-format fields as
# unknown (`Unknown name "store": Cannot find field`, HTTP 400 INVALID_ARGUMENT),
# and an existing Responses client sends `store: false` on every call. Dropping
# them is what lets a Responses caller reach a Gemini chat target at all; the
# provider supplies its own defaults for all three.
omit_body_fields = ["store", "metadata", "prompt_cache_key"]
# `none` is not a value this surface accepts: it answers 400
# INVALID_ARGUMENT while minimal, low, medium and high are all served.
# Dropping it here is the last word on effort, after every override.
unsupported_reasoning_effort = ["none"]
