# =====================================================================
# GOOGLE AI STUDIO -- REALTIME MUSIC AND ROBOTICS
# =====================================================================
# The last two services in the owner's Free-tier table (rows 20 and 17) and the last
# two of the 26-model set. Neither is a chat lane, so neither gets a route: one is a
# WebSocket music session and one is an image-plus-instruction call whose answer is a
# JSON geometry contract.
#
# Quota is the owner-recorded Free-tier ceiling at capture, not a remaining balance.
# The counters are this deployment's own ledger: minute and day counters are keyed on
# (quota group, physical model) and charged once per physical call, so a music session
# is one charge per connection and a spatial request is one charge per image.
#
# Both ceilings below are this deployment's own bounds, chosen so a caller cannot hold
# a bounded resource open indefinitely; they are not provider limits. A music session
# has no request boundary, which is why its ceiling has to be declared at all: the
# surface stops forwarding the frame that would cross it and reports the running total
# beside every audio chunk, so a client never has to guess.

# Lyria Realtime -- lyria-realtime-exp. 15 RPM / no input TPM / 1,500 RPD, 1,048,576
# context. The setup frame carries the model and nothing else; prompts, generation
# config and playback control are per-message.
[capability_clients.music-lyria-realtime]
format = "google_music"
base_url = "https://generativelanguage.googleapis.com"
model = "lyria-realtime-exp"
api_key_env = "SWITCHYARD_GEMINI_API_KEY"
timeout_seconds = 300
quota_group = "google-ai-studio-free"
requests_per_minute = 15
daily_request_limit = 1500

[capabilities.gemini-music-lyria-realtime]
id = "gemini-music-lyria-realtime"
target = "music-lyria-realtime"

# 32 MiB of delivered audio per session. The surface accounts the decoded length of
# every audio chunk it forwards, so this is a real ceiling rather than a hope; the
# first qualified session measures the delivered byte rate, and this number divided by
# that rate is how many seconds a session may play.
max_session_audio_bytes = 33554432

# Gemini Robotics ER 2 Preview -- gemini-robotics-er-2-preview. 5 RPM / 250,000 input
# TPM / 20 RPD, 131,072 context. A plain generateContent call that is asked for one
# specific geometry contract per task: normalized [y, x] points in 0..1000, boxes, or
# a trajectory. Prose is refused rather than returned, because a caller that asked for
# coordinates cannot use a sentence.
[capability_clients.robotics-er-2]
format = "google_robotics_spatial"
base_url = "https://generativelanguage.googleapis.com"
model = "gemini-robotics-er-2-preview"
api_key_env = "SWITCHYARD_GEMINI_API_KEY"
timeout_seconds = 120
quota_group = "google-ai-studio-free"
requests_per_minute = 5
input_tokens_per_minute = 250000
daily_request_limit = 20

[capabilities.gemini-robotics-er-2-spatial]
id = "gemini-robotics-er-2-spatial"
target = "robotics-er-2"
max_input_tokens = 131072

# 8 MiB of scene per request: a local admission bound, so an oversize image is refused
# here instead of over the network. The surface reads the PNG/JPEG/WebP header to know
# the scene's dimensions, so its token estimate is measured from the image itself.
max_image_bytes = 8388608

# =====================================================================
# STEPHEN (OpenRouter, dedicated credential)
# =====================================================================
# One llm_client, one credential. Every target below it resolves to
# SWITCHYARD_STEPHEN_OPENROUTER_API_KEY and to nothing else. Clients are
# built per llm_client and each route's router is populated from that
# route's targets only, so a target on this client can never be served by
# the global `openrouter` credential.
#
# max_retries = 0 is deliberate. OpenRouter's free-tier daily cap is
# ACCOUNT-WIDE ("openrouter_free_tier_daily"): once it is exhausted every
# free model returns 429. Retrying inside one candidate would multiply the
# attempts against a cap that cannot be satisfied by retrying, and would
# spend the route's whole fallback budget on the same exhausted account.
# The ordered candidate list is the retry strategy instead: one attempt per
# candidate, then an honest failure.
#
# attempt_timeout_ms bounds "this candidate is producing nothing" so a hung
# upstream advances to the next candidate instead of consuming the call.
[llm_clients.openrouter_stephen]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
locality = "external"
api_key_env = "SWITCHYARD_STEPHEN_OPENROUTER_API_KEY"
max_retries = 0
attempt_timeout_ms = 120000

[llm_clients.google_gemini_stephen]
format = "openai_chat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
locality = "external"
api_key_env = "SWITCHYARD_GEMINI_STEPHEN_API_KEY"
quota_group = "google-ai-studio-free-stephen"
max_retries = 0
# Google's OpenAI-compatibility surface requires a provider-issued `thought_signature` on
# the first replayed `functionCall` part of every step and answers 400 INVALID_ARGUMENT
# without one. A call another model issued has no signature to send, and Google documents
# exactly that case: `skip_thought_signature_validator` is accepted in its place, at a stated
# cost in context fidelity. Declaring it here is what lets a reply carrying another
# provider's tool lineage be served by a Gemini target instead of being skipped; a call that
# does carry its own signature is echoed verbatim, so the stand-in is only ever used where
# there is nothing real to send.
tool_signature_placeholder = "skip_thought_signature_validator"


[llm_clients.google_gemma_31b_stephen]
format = "openai_chat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
locality = "external"
api_key_env = "SWITCHYARD_GEMINI_STEPHEN_API_KEY"
quota_group = "google-ai-studio-free-stephen"
max_retries = 0
failure_cooldown_ms = 300000

