video = false
daily_request_limit = 500
# Capacity and admission are two different numbers and both are stated here.
# The window is the model's: 1,048,576 tokens. The ceiling is the project's free-tier
# allowance of 250,000 tokens per minute -- a single request larger than the minute is
# one the provider cannot complete, so it is refused locally instead of being charged.
context_window = 1048576
max_input_tokens = 250000
# A selection fact: requests served here cost nothing inside the allowance, so no metered
# leg may be ordered ahead of this one. Without it the router could only use declared order.
free_tier = true

# The 31B answers 503 while it spins up, and the lane's default failure cooldown is five
# seconds -- short enough to spend the whole free-minute budget re-asking a model that is
# still starting. It therefore gets its own client entry, identical to the shared one except
# for the cooldown, rather than a group: `cooldown_group` would make a capacity fact about
# the large model cool the small one down with it, and the small one is this lane's default.
# The daily counter is still shared, because it is the same project and the same allowance.
requests_per_minute = 15
input_tokens_per_minute = 250000

# Pool membership label. A route that names this group compares the group before it
# compares any leaf; the label is the manifest's only record of which pool a leaf serves.
groups = ["smart-gemini-bounded"]

[llm_clients.google_gemma_31b]
format = "openai_chat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
locality = "external"
api_key_env = "SWITCHYARD_GEMINI_API_KEY"
quota_group = "google-ai-studio-free"
max_retries = 0

# Gemma 4, added for bounded tasks. Native ids from the owner's AI Studio listing; the
# serving receipt is what `smart-gemini-bounded` exists to collect, so nothing else depends
# on them yet.
#
# The 262,144-token window is the model's physical capacity. The 16,000-token ceiling is
# the free-tier tokens-per-minute allowance for this project, and it is the number that
# binds: a bounded lane that accepted more would be spending calls Google refuses.
#
# daily_request_limit is the model's own RPD allowance (14,400). It is a local budget, not
# an observed balance -- see the note on the Lite targets above.
[targets."direct-google-gemma-4-31b-it"]
tool_calling = true
id = "gemma-4-31b-it"
llm_client = "google_gemma_31b"
# The Google OpenAI-compatibility surface rejects Responses-format fields as
# unknown (`Unknown name "store": Cannot find field`, HTTP 400 INVALID_ARGUMENT),
# and an existing Responses client sends `store: false` on every call. Dropping
# them is what lets a Responses caller reach a Gemini chat target at all; the
# provider supplies its own defaults for them.
#
# `temperature` belongs to the same class and was measured separately: a Responses
# caller pinning 1.0 is answered `Unsupported parameter: temperature` (HTTP 400), so
# the field is omitted here instead of relayed with a value the provider refuses.
# Omitting it lets the surface apply its own default; it is not a low-temperature
# steering choice, and no leg depends on a caller-chosen value.
omit_body_fields = ["store", "metadata", "prompt_cache_key", "temperature"]
# `none` is not a value this surface accepts: it answers 400
# INVALID_ARGUMENT while minimal, low, medium and high are all served.
# Dropping it here is the last word on effort, after every override.
unsupported_reasoning_effort = ["none"]
vision = false
video = false
context_window = 262144
max_input_tokens = 12307
daily_request_limit = 14400
# Free inside the allowance, and unable to carry a caller's reasoning control: the measured
# wire refuses `reasoning_effort` with HTTP 400. Stating both lets selection prefer this leg
# for small work and skip it for a request that carries a control, instead of forwarding a
# parameter the provider rejects.
free_tier = true
accepts_reasoning_control = false
# Hosted Gemma writes its chain of thought into the visible message: the measured body is
# `<thought>...</thought>` followed by the answer, with `completion_tokens` counting only the
# answer and `total_tokens` counting both. Declaring the marker is what keeps the monologue
# out of the caller's text; without it the whole block is returned as output.
hosted_reasoning = "thought_tag"

# Measured 2026-11-21: 61-328 thinking tokens for prompts of 49-438 tokens, and no
# visible text at all below a 512-token reservation, because the thought is charged
# against the caller's budget. A smaller request is skipped before dispatch instead of
# spending a provider call to rediscover a limit the deployment already knows.
min_output_tokens = 512
# The free-tier row for this project: 30 requests and 16,000 input tokens a
# minute, 14,400 requests a day. Admission pads every reservation by 1,300 per
# mille, because the estimator under-counted this lane once already -- 15,202
# estimated against 18,054 provider tokens -- and a request that cannot fit the
# minute must be refused before dispatch rather than after it. The ceiling is the
# largest estimate the padded window admits, not the window itself: a ceiling the
# governor refuses on every large request states capacity that does not exist.
requests_per_minute = 30
input_tokens_per_minute = 16000
# The pad the estimator's measured under-count on this lane requires.
admission_margin_permille = 1300


