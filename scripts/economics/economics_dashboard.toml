# The economics dashboard's identity and the deployment it reads.
#
# `job` is the Prometheus job label of the Switchyard deployment the dashboard
# reads. Every panel selects on it, so changing this points the whole dashboard
# at a different deployment.
#
# `uid` is the Grafana dashboard uid. The publishing tool creates a dashboard
# with this uid, and the V7.11 back-link points at it.
#
# `message` is the revision note recorded with the dashboard when it is
# published.

job = "switchyard-v7"

uid = "turnstone-switchyard-economics-v8"
title = "SWITCHYARD ECONOMICS & TOKEN ACCOUNTING V8.0"

# The Grafana datasource the panels query. This is a deployment fact, not a
# property of the dashboard's content, so it lives here rather than in the
# generator.
datasource_uid = "df7wrp11a9hq8c"
datasource_type = "prometheus"

# The routing dashboard this one links back to. The reverse link is added by
# prepare_v7_backlink.py.
routing_uid = "turnstone-switchyard-v7"

# The OpenRouter accounts this deployment holds. Each is a separate financial
# account with its own credit, so the dashboard shows them side by side and
# never adds them into one figure. `openrouter_account` is the one whose client
# is named after the provider; `openrouter_secondary_account` is the second
# account, whose client carries a distinct name and a distinct credential.
openrouter_account = "openrouter"
openrouter_secondary_account = "openrouter_stephen"

message = """
V8.0: rolling 1h/24h windows with coverage, both OpenRouter accounts shown
separately, DeepSeek balance components. Reasoning inside completion, cached
inside prompt; rolling totals come from observed events, not increase().
"""
