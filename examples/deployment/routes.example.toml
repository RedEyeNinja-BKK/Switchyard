# An example deployment file. It shows the shape of a fleet that serves
# several providers at once: direct routes per model, small groups that
# fall back through a list of candidates, whole-route tiers over those
# groups, decision lanes, and the embedding and reranking capabilities.
#
# Every base_url below points at a placeholder host. Point them at your own
# servers and export the api_key_env variables before starting the server.
#
#   switchyard-server --config routes.example.toml --dry-run
#
# The api_key_env values are read from the environment. The file itself
# carries no secret.
schema_version = 1

[llm_clients.deepseek]
format = "openai_responses"
base_url = "https://api.deepseek.com"
api_key_env = "SWITCHYARD_DEEPSEEK_API_KEY"
max_retries = 2

[llm_clients.htpc]
format = "openai_responses"
base_url = "http://localhost:8889/v1"
api_key_env = "SWITCHYARD_HTPC_API_KEY"
max_retries = 2

[llm_clients.thaillm]
format = "openai_responses"
base_url = "https://thaillm.or.th/api/v1"
api_key_env = "SWITCHYARD_THAILLM_API_KEY"
max_retries = 2

[llm_clients.openai]
format = "openai_responses"
base_url = "https://chatgpt.com/backend-api/codex"
api_key_env = "SY_OPENAI_OAUTH_TOKEN"
requires_list_input = true
max_retries = 2

[llm_clients.openai_nt]
format = "openai_responses"
base_url = "https://chatgpt.com/backend-api/codex"
api_key_env = "SY_OPENAI_OAUTH_TOKEN"
requires_list_input = true
max_retries = 2

[llm_clients.openrouter]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"
max_retries = 2

[llm_clients.comfyninja]
format = "openai_responses"
base_url = "http://localhost:8446/v1"
api_key_env = "SWITCHYARD_COMFYNINJA_API_KEY"
max_retries = 2

