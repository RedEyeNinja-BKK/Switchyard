# =====================================================================
# Global (non-Stephen) counterparts for Stephen models that had none
# =====================================================================
# Four Stephen models had no route on the GLOBAL `openrouter` credential. Each
# gets a target and a direct route here so the model is reachable with the
# global key as well as Stephen's. Targets must be declared per client - one
# route may not mix two credentials - so these are separate targets pointing at
# the same upstream ids as their Stephen counterparts.
#
# Pricing note: deepseek/deepseek-v4.1-flash is a METERED model, unlike the
# `:free` slugs around it. It is reachable on the global key by name only; the
# gateway, not the route, is what bounds spend.

