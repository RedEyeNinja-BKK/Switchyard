# Published figures for the architecture, measured for the value space: gemini-embedding-001
# declares 3,072 output dimensions and a 2,048-token input limit. Both are declared so the
# surface refuses an input past the limit instead of truncating it.
#
# `normalization = "L2"` is now MEASURED, not assumed: the qualification call on
# 2026-11-22 returned 3,072 finite values with an L2 norm of 1.000000, so the surface
# verifies that property on every response instead of leaving it an unproven claim.
[capabilities.gemini-embedding]
id = "gemini-embedding"
target = "embedding-google"
contract = "google-embedding-space:gemini-embedding-001-v1"
dimensions = 3072
normalization = "L2"
max_batch = 16
max_input_tokens = 2048

# Embedding 2 is a different codec and a different value space, not a newer version of the
# lane above: width is a request field here, a task travels as a text prefix instead of
# task_type, and vectors are not comparable with 001 or with the 1024-dim Qwen index.
#
# QUALIFIED 2026-11-22 on the project key, text only, four physical `:embedContent` calls:
# one single-input call with `output_dimensionality: 3072` and one caller batch of two
# inputs that fanned out to two calls. Every response was an authenticated 2xx with
# `embedding.values` of exactly 3,072 finite numbers and L2 norm 1.000000, and the two
# batch vectors were distinct and in input order. The hold has been lifted for TEXT ONLY.
#
# Still unqualified and therefore unclaimed: `:batchEmbedContents` (the codec uses bounded
# fan-out instead), media carriers (image/audio/video/PDF would need their own evidence),
# and any width other than 3,072 (a narrower lane would be a separate capability id with
# its own contract, because vectors of different widths cannot share an index).
#
# Text only. This codec sends content.parts[].text and nothing else; it does not accept
# images, audio, video or PDF, and nothing here should be read as claiming that it does.
[capabilities.gemini-embedding-2]
id = "gemini-embedding-2"
target = "embedding-google2"
contract = "google-embedding-space:gemini-embedding-2-v1"
dimensions = 3072
normalization = "L2"
max_batch = 8
max_input_tokens = 8192

# =====================================================================
# GOOGLE SPEECH (TTS) AND TRANSCRIPTION — native typed lanes
# =====================================================================
# These are not chat lanes with a different output type. A speech lane sends text plus a
# voice and receives one raw-PCM blob; a transcription lane sends a typed audio payload and
# receives text. Each carries its own budget, scoped per physical model.
#
# QUALIFIED 2026-11-22, one authenticated call per lane against the live API: all four speech
# lanes answered 200 with a RIFF/WAVE container reported at 24 kHz and voice Kore, and the
# transcription lane answered 200 with the spoken sentence returned exactly. The four speech
# bodies were 182,444–201,672 bytes and the transcription measured 3.931 s for a 188,730-byte
# container, which is the same duration the headers imply to the millisecond — the container
# written here and the container measured there agree. What that establishes is that each
# wire works end to end. It does not establish output quality, latency distribution, a
# provider limit, or that these four engines sound alike.
#
# The four TTS models each carry 3 RPM / 10,000 input TPM / 10 RPD and the transcription
# model 3 RPM / 10,000 input TPM / 25 RPD. Those are the owner's Free-tier limits for these
# physical models, from the same 26-row table
# (docs/evidence/gemini-r3/2026-11-21/OWNER-CONTROLLING-ALL-FREE-CAPABILITIES.md), enforced
# per physical call. They are rate ceilings at capture, not remaining allowance. One call per
# model proved nothing about where the ceilings actually bite — no lane reached its per-minute
# or per-day bound — so the enforcement is real but its headroom is unmeasured.
#
# Held is inventory, never a fallback: a request naming an unqualified lane is refused locally
# with zero Google egress, and no request may be answered from a chat model instead.
#
# `audio_format = "wav"` means: the engine returns PCM, and this surface writes the RIFF
# header itself. `pcm` returns the same samples bare. A compressed container is refused
# rather than mislabelled, because this deployment ships no encoder.
[capability_clients.speech-2-5-flash]
