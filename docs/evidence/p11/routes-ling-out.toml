# ---------------------------------------------------------------
# Gemini Decision 1 - the Decisions API, not a chat lane
# ---------------------------------------------------------------
# `POST /v1beta/decisions`. The method is NOT `:createDecision`: that path answers a
# bare 404 on both v1 and v1beta, while `:generateContent` on the same model returns a
# proper 400, which is the paired control that tells a routing refusal from a bad URL.
#
# Qualified 2026-11-22 with authenticated 200s for all three question kinds: noul
# (probability the question holds), choice (a criteria OBJECT of option id -> label)
# and score (an ORDERED ARRAY of level labels). Two asymmetries in Google's own
# validator are worth keeping: `choice.criteria` must be an object while
# `score.criteria` must be an array, and `noul` needs only `instructions`.
#
# The shared input is `input`, a list of typed content blocks whose `type` is one of
# audio, document, image, text, video. Only the text form is qualified here, so this
# target accepts a structured context and refuses a bare string locally rather than
# spending a provider call on a shape that cannot work.
#
# The transport is already compiled into the deployed binary (decision_transport.rs,
# DecisionTransport::GoogleDecisions), so this is a configuration addition, not a new
# codec. The lane is not a chat target: it carries no chat capabilities, no
# reasoning policy and no model-pool entry, so it cannot be selected for a chat turn.
#
# Usage note from the probe: `usage.total_output_tokens` is always 0. The model's
# declared one output token is not billed in the response, so input TPM is the only
# metered axis.
#
# Budget: 200 RPM / 50,000 input TPM / 10,000 RPD are the owner's Free-tier LIMITS for
# this physical model from the same 26-row record. They are declared here for the same
# reason as every other lane, with one honest caveat: the decision path does not yet
# pass through the pacing governor, so these numbers are a declaration of the ceiling
# and not yet an enforced gate. Enforcing them is the next code change; nothing in this
# file claims otherwise.
[targets."direct-google-gemini-decision-1"]
id = "gemini-decision-1"
llm_client = "google_gemini"
decision_transport = "google_decisions"
decision_base_url = "https://generativelanguage.googleapis.com"
decision_path = "/v1beta/decisions"
decision_api_key_env = "SWITCHYARD_GEMINI_API_KEY"
supported_types = { noul = true, choice = true, score = true }
# Measured 2026-11-22 against the live service: Google accepts `input` as a bare
# string (200 for noul, choice, score and mixed questions) and rejects an object
# with 400 "The 'type' parameter is required at 'input[0]'" unless it carries a
# `type`. The earlier declaration had these two forms inverted, so the lane
# refused locally what Google accepts and forwarded what Google rejects.
state_forms = { plain_string = true, structured = false }
free_tier = true
requests_per_minute = 200
input_tokens_per_minute = 50000
# The model declares a 262,144-token window, but a single request larger than the
# minute budget could never be admitted, so the per-request ceiling is the budget
# itself. Refusing a 200k-token document locally is the truth; advertising the window
# here would promise a request this project cannot serve.
max_input_tokens = 50000
daily_request_limit = 10000


