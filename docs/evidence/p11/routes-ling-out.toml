target = "speech-3-8-flash"
voice = "Kore"
audio_format = "wav"
audio_sample_rate = 24000
max_input_tokens = 8192

# `audio/wav` only, and 300 seconds: the duration bound is what spends the 10,000-token
# minute window at the 32-input-tokens-per-second conversion this deployment assumes
# (300 s x 32 = 9,600 tokens). That conversion is an assumption, not a measurement —
# if the provider charges audio differently, the duration bound is what would have to
# change with it. max_audio_bytes is the inline request ceiling; 15 MiB of raw audio stays
# inside Google's 20 MB inline request cap once base64 inflates it by four thirds.
# Omitted deliberately: a declared max_input_tokens, because the enforced token bound here
# is duration, not bytes.
[capabilities.gemini-transcribe]
id = "gemini-transcribe"
target = "transcribe-3-5"
task_prefix = "Transcribe this recording verbatim."
max_audio_seconds = 300
max_audio_bytes = 15728640

# =====================================================================
# GOOGLE LIVE — BidiGenerateContent over WebSocket (stateful sessions)
# =====================================================================
# All six Live variants speak Google's stateful BidiGenerateContent WebSocket
# protocol (wss://generativelanguage.googleapis.com/ws/...BidiGenerateContent).
# The first frame is a BidiGenerateContentSetup built from the capability
# declaration; the caller never supplies one. "Unlimited" RPM/RPD means no finite
# provider limit displayed for this project — not infinite concurrency, duration,
# or sessions. Local bounded resource control is applied separately per owner
# instruction: concurrent sessions, handshake deadline, buffer/frames, audio sizes
# and backpressure are bounded at this surface.
#
# Model-specific setup (response modalities, system instruction, thinking control)
# is declared per capability so the caller cannot change the session shape. The
# thinking control differs by family and is NOT interchangeable: Gemini 2.5 takes
# generationConfig.thinkingConfig.thinkingBudget, Gemini 3.x rejects thinkingBudget
# (close 1007 "Thinking budget is not supported for this model") and takes
# thinkingLevel instead. The Google API key travels only in the upstream WebSocket
# URL's `key=` query parameter; it is never rendered into client-visible frames or
# logs.
#
# MEASURED 2026-11-22 (direct BidiGenerateContent, one setup per variant). Google
# delivers JSON in BINARY WebSocket frames; a client must decode them as UTF-8.
#   gemini-3.5-live-translate-preview   [TEXT]                        setupComplete
#   gemini-3.5-transcribe-live          [TEXT]                        setupComplete
#   gemini-3.8-live                     [AUDIO]                       setupComplete + audio + outputTranscription
#                                       [TEXT] / [AUDIO,TEXT] / thinkingBudget -> close 1007
#   gemini-3.8-live-extended-thinking   [AUDIO] + thinkingLevel HIGH  setupComplete + audio + outputTranscription
#                                       thinkingLevel MINIMAL         -> close 1007 (level not published)
#                                       thinkingBudget                 -> close 1007
#   gemini-2.5-flash-native-audio-latest [AUDIO]                      setupComplete + audio
#   gemini-3.1-flash-live-preview       [AUDIO]                       setupComplete + audio
#                                       [TEXT] / [AUDIO,TEXT]         -> close 1007

