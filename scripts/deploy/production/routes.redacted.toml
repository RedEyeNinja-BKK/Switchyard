# r1 = ERNIE 5.5 Flash Preview (free), r2 = Nemotron 3.5 Super VL (free).
# Crouton Alpha was retired upstream on 2026-11-11 (its provider tombstone
# redirects to meta/muse-ember, which is PAID), so the free lane was rebuilt on
# two free models instead of one. ERNIE has the larger context (1,024,000) and
# is text-only; Nemotron is smaller (1,000,000) and carries the vision leg. The
# route keeps context_window = 1000000 so both fit. Route::execute drops the
# text-only ERNIE target before dispatch, so an image request lands on Nemotron
# instead of being sent to a model that cannot read it. No paid model is ever a
# candidate.
#
# Vision is true because Nemotron serves INLINE images (data: URLs), proven live
# through this route on 2026-11-11 (driver logged model=nemotron, answer "Red").
# Remote image URLs are not fetchable on this free endpoint (upstream 404), so the
# route declares image_carrier = "inline". Video follows the same measurement:
# inline video is 200 on this endpoint family, remote video URL is 404, so the route
# declares video = true with video_carrier = "inline" and refuses a remote video URL
# locally instead of emitting a late provider 404.
[routes.smartfree]
id = "smartfree"
type = "passthrough"
target = "openrouter-ernie-5_5-flash-preview-free"
candidates = ["openrouter-nemotron-3_5-super-vl-free"]
context_window = 1000000
tool_calling = true
reasoning = true
vision = true
video = true
video_carrier = "inline"
# Narrowed to what its targets serve: the measured vision target on this route
# answers inline media only and 404s a remote URL, so advertising "both" here
# would promise a carrier nothing below the route can deliver.
image_carrier = "inline"
route_reasoning_policy = "inherit"

[routes.smartfree-bounded]
id = "smartfree-bounded"
type = "passthrough"
target = "openrouter-nemotron-3_5-super-vl-free"
candidates = []
context_window = 262144
tool_calling = true
reasoning = true
vision = true
video = true
video_carrier = "inline"
# Narrowed to what its targets serve: the measured vision target on this route
# answers inline media only and 404s a remote URL, so advertising "both" here
# would promise a carrier nothing below the route can deliver.
image_carrier = "inline"
route_reasoning_policy = "none"

