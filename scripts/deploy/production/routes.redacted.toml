# Free embedding lane on the GLOBAL credential. Nemotron's free embed model is not
# listed in /api/v1/models (it is an alpha/programme model) but answers on the
# standard embeddings wire. Verified 2026-11-11 on both credentials: 4096 dims,
# L2-normalised, byte-identical vectors across credentials (cosine 1.000000).
# The contract is nevertheless named for THIS lane: config requires every
# embedding contract to belong to exactly one client, and this client holds the
# global credential, which has its own free-tier cap. Vectors are comparable
# with ST_Embed's, so a consumer may reuse an index across the two.
[capability_clients.embedding-free-nemotron]
format = "openai_embeddings"
base_url = "https://openrouter.ai/api"
model = "nvidia/nemotron-3.5-embed-8b:free"
api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"
timeout_seconds = 120

[capability_clients.reranker-local]
format = "cohere_jina_rerank"
base_url = "https://reninja.tailnet-example.ts.net:8449"
model = "qwen3-reranker-0.6b-q8_0"
timeout_seconds = 120

# Free rerank lane on the GLOBAL credential. Same model family as Stephen's
# ST_Rerank and the same scores cross-credential; measured 0.85s for 20 documents
# where smartlocal-rerank took 11.0s.
[capability_clients.reranker-free]
format = "cohere_jina_rerank"
base_url = "https://openrouter.ai/api"
model = "nvidia/nemotron-3.5-rerank-8b:free"
api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"
timeout_seconds = 120

[capabilities.smartlocal-embedding]
id = "smartlocal-embedding"
target = "embedding-local"
contract = "local-embedding-space:v1"
dimensions = 1024
normalization = "L2"
max_batch = 64

# Replaces the retired 1024-dim free embedding lane (its upstream
# liquid/lfm-2.5-embedding-350m:free model is no longer in the catalogue and no
# consumer referenced the lane).
[capabilities.smartfree-embedding]
id = "smartfree-embedding"
target = "embedding-free-nemotron"
contract = "openrouter-embedding-space:nemotron3.5-embed8b-v1"
dimensions = 4096
normalization = "L2"
max_batch = 64

[capabilities.smartlocal-rerank]
id = "smartlocal-rerank"
target = "reranker-local"
max_candidates = 64
top_n = 64
max_doc_chars = 1024
max_query_chars = 512

[capabilities.smartfree-rerank]
id = "smartfree-rerank"
target = "reranker-free"
max_candidates = 64
top_n = 64
max_doc_chars = 1024
max_query_chars = 512

# =====================================================================
# STEPHEN (OpenRouter, dedicated credential)
# =====================================================================
# One llm_client, one credential. Every target below it resolves to
# SWITCHYARD_STEPHEN_OPENROUTER_API_KEY and to nothing else. Clients are
# built per llm_client and each route's router is populated from that
# route's targets only, so a target on this client can never be served by
# the global `openrouter` credential.
#
# max_retries = 0 is deliberate. OpenRouter's free-tier daily cap is
# ACCOUNT-WIDE ("openrouter_free_tier_daily"): once it is exhausted every
# free model returns 429. Retrying inside one candidate would multiply the
# attempts against a cap that cannot be satisfied by retrying, and would
# spend the route's whole fallback budget on the same exhausted account.
# The ordered candidate list is the retry strategy instead: one attempt per
# candidate, then an honest failure.
#
# attempt_timeout_ms bounds "this candidate is producing nothing" so a hung
# upstream advances to the next candidate instead of consuming the call.
[llm_clients.openrouter_stephen]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "SWITCHYARD_STEPHEN_OPENROUTER_API_KEY"
max_retries = 0
attempt_timeout_ms = 120000

# ---- Stephen completion targets ----
[targets.stephen-nemotron-3-5-super-vl-free]
id = "nvidia/nemotron-3.5-super-vl:free"
llm_client = "openrouter_stephen"
vision = true
video = true
video_carrier = "inline"
# Same upstream model as the global Nemotron target, measured the same way on this
# credential: inline image 200, remote image 404. Inline is the only proven carrier.
image_carrier = "inline"
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

[targets.stephen-flint-v1-0-free]
id = "recursive/flint-v1.0:free"
llm_client = "openrouter_stephen"
vision = false
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

# ---- Stephen primitive routes ----
# ---- ST_Route: FREE ONLY -------------------------------------------------
# Tier1 -> Tier2 -> Tier3. No paid tier is declared anywhere in this manifest,
# so no free request can escalate into a paid one. Children are whole routes, so
# each exhausts its own candidate list before the parent crosses.
[composites.ST_Route]
# ST_Paid is the fourth stage. It draws on the SAME Stephen credential as the free
# tiers, so an account-wide cap on it does not help: no declared route crosses to a different credential
# crosses to a different credential (htpc). Order within the shared credential is the
# gate; putting ST_Paid last means a quota or auth failure on the free tiers is
# terminal here, which is correct, because no later child could answer it.
children = ["ST_Tier1", "ST_Tier2", "ST_Tier3", "ST_Paid"]
context_window = 262144
tool_calling = true
reasoning = true
vision = true
video = true

# ---- Stephen embedding and reranking capabilities ----
[capability_clients.embedding-stephen]
format = "openai_embeddings"
base_url = "https://openrouter.ai/api"
model = "nvidia/nemotron-3.5-embed-8b:free"
api_key_env = "SWITCHYARD_STEPHEN_OPENROUTER_API_KEY"
timeout_seconds = 120

[capability_clients.reranker-stephen]
format = "cohere_jina_rerank"
base_url = "https://openrouter.ai/api"
model = "nvidia/nemotron-3.5-rerank-8b:free"
api_key_env = "SWITCHYARD_STEPHEN_OPENROUTER_API_KEY"
timeout_seconds = 120

[capabilities.ST_Embed]
id = "ST_Embed"
target = "embedding-stephen"
contract = "stephen-embedding-space:nemotron3.5-embed8b-v1"
dimensions = 4096
normalization = "L2"
max_batch = 64

[capabilities.ST_Rerank]
id = "ST_Rerank"
target = "reranker-stephen"
max_candidates = 64
top_n = 64
max_doc_chars = 1024
max_query_chars = 512

# =====================================================================
# ST tier hierarchy (Stephen's dedicated OpenRouter credential)
# =====================================================================
# Only genuinely new targets are declared here. nemotron / flint already
# exist with correct capability facts. Every ST target resolves to
# SWITCHYARD_STEPHEN_OPENROUTER_API_KEY and nothing else, because clients are
# built per [llm_clients.*].

[targets.stephen-dots-3-note-preview-free]
id = "dots-studio/dots-3-note-preview:free"
llm_client = "openrouter_stephen"
vision = true
video = false
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

# Both Gemma routes sit on one Google AI Studio pool, so a pool-wide 429 is one
# fact about the pool rather than about either model. Declaring the shared group
# makes the first failure stand for both: the sibling is skipped instead of
# spending a second request the pool has already refused. The skip replays the
# upstream status, so a caller still sees 429 rather than a generic outage.
[targets.stephen-gemma-4-26b-a4b-it-free]
id = "google/gemma-4-26b-a4b-it:free"
llm_client = "openrouter_stephen"
vision = true
video = false
# Unverified: every probe on 2026-11-11 was refused upstream (429 / 503), so neither
# carrier is proven. Inline stays admitted and remote is refused, because a skipped
# candidate is recoverable while a remote fetch the endpoint cannot make surfaces as
# a provider 404 the caller cannot act on.
image_carrier = "inline"
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"
cooldown_group = "google-ai-studio"

[targets.stephen-gemma-4-31b-it-free]
id = "google/gemma-4-31b-it:free"
llm_client = "openrouter_stephen"
vision = true
video = false
# Unverified: every probe on 2026-11-11 was refused upstream (429 / 503), so neither
# carrier is proven. Inline stays admitted and remote is refused, because a skipped
# candidate is recoverable while a remote fetch the endpoint cannot make surfaces as
# a provider 404 the caller cannot act on.
image_carrier = "inline"
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"
cooldown_group = "google-ai-studio"

# ---- ST_Tier1: vision-capable free tier ----------------------------------
# Dots is R1: its isolated inference and vision tests succeeded where Nemotron
# showed intermittent upstream 500s. Dots carries a published expiration
# (2026-12-31), so its replacement must stay a configuration-only change.
[routes.ST_Tier1]
id = "ST_Tier1"
type = "passthrough"
target = "stephen-dots-3-note-preview-free"
candidates = ["stephen-nemotron-3-5-super-vl-free"]
context_window = 262144
tool_calling = true
reasoning = true
vision = true
video = true
video_carrier = "inline"
route_reasoning_policy = "inherit"

# ---- ST_Tier2: text-only free tier ---------------------------------------
[routes.ST_Tier2]
id = "ST_Tier2"
type = "passthrough"
target = "stephen-flint-v1-0-free"
candidates = []
context_window = 262144
tool_calling = true
reasoning = true
vision = false
route_reasoning_policy = "inherit"

# ---- ST_Tier3: Gemma free tier -------------------------------------------
# context_window is the model-level contract OpenRouter publishes for these two
# slugs, and OpenRouter filters endpoints by prompt length when it routes.
#
# Measured per-endpoint facts (2026-10-22) that the route-level number hides:
#   gemma-4-26b-a4b-it:free  endpoints span 131072..262144; DeepInfra caps
#                            max output at 16384
#   gemma-4-31b-it:free      endpoints span 131072..262144; Venice caps
#                            max output at 8192
# Switchyard does not enforce context_window locally: there is no pre-dispatch
# admission check and no truncation, so an over-long request or an over-large
# max_output_tokens reaches the provider and comes back as an upstream 400.
# That is an honest failure, never a silently shortened prompt. If these tiers
# must guarantee the floor rather than the ceiling, declare 131072 instead and
# accept that requests in 131073..262144 are refused at a tier that could have
# served them.
[routes.ST_Tier3]
id = "ST_Tier3"
type = "passthrough"
target = "stephen-gemma-4-26b-a4b-it-free"
candidates = ["stephen-gemma-4-31b-it-free"]
context_window = 262144
tool_calling = true
reasoning = true
vision = true
video = false
# Narrowed to what its targets serve: the measured vision target on this route
# answers inline media only and 404s a remote URL, so advertising "both" here
# would promise a carrier nothing below the route can deliver.
image_carrier = "inline"
route_reasoning_policy = "inherit"

# ---- ST_Paid: explicitly selected ONLY -----------------------------------
# Paid inference, never entered automatically. ST_Route lists only the free
# tiers, so a free request cannot escalate here; reaching this route requires
# naming it. Candidates are ordered within the paid tier only, so a paid failure
# falls back to another paid model on the SAME credential and never to a free
# target or the global key.
#
# All three slugs were verified against the provider catalogue on 2026-10-28:
#   z-ai/glm-5.3-flash              ctx 1048576, text+image+video -> text, tools
#   deepseek/deepseek-v4.1-flash    ctx 1048576, text+image -> text, tools
#   deepseek/deepseek-v4.1-flash-1017 ctx 1048576, text+image -> text, tools
# Worst-case endpoint prices are USD 0.225/2.00, 0.60/2.40 and 0.45/1.80 per
# million tokens; the gateway reserves against those figures.
[targets.stephen-paid-glm-5-3-flash]
id = "z-ai/glm-5.3-flash"
llm_client = "openrouter_stephen"
vision = true
video = true
# Measured 2026-11-11 through this deployment's Responses wire: text, inline image,
# remote image, inline video and remote video each returned 200. This is the only
# target proven on both carriers for both media, so both are declared explicitly
# rather than left to the pre-carrier default.
video_carrier = "both"
image_carrier = "both"
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

[targets.stephen-paid-deepseek-v4-1-flash]
id = "deepseek/deepseek-v4.1-flash"
llm_client = "openrouter_stephen"
vision = true
video = false
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

# deepseek/deepseek-v4.1-flash-1017 is the 2026-10-17 snapshot of the same
# model family, verified in the provider catalogue on 2026-10-28 (ctx
# 1048576, text+image -> text, tools). It shares the Stephen credential and
# therefore never appears on the global client in the same route.
[targets.stephen-paid-deepseek-v4-1-flash-1017]
id = "deepseek/deepseek-v4.1-flash-1017"
llm_client = "openrouter_stephen"
vision = true
video = false
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

[routes.ST_Paid]
id = "ST_Paid"
type = "passthrough"
target = "stephen-paid-deepseek-v4-1-flash-1017"
candidates = ["stephen-paid-deepseek-v4-1-flash", "stephen-paid-glm-5-3-flash"]
context_window = 1048576
tool_calling = true
reasoning = true
vision = true
video = true
route_reasoning_policy = "inherit"

# ---- global catalog addition: recursive/flint-v1.0:free ----
# Same upstream model as the Stephen free tier's Flint candidate, different
# client and different credential. The two targets coexist because execution is keyed by
# (llm_client, model id): a route may not mix two clients for one model id,
# and these two models never share a route.
[targets.openrouter-flint-v1-0-free]
id = "recursive/flint-v1.0:free"
llm_client = "openrouter"
vision = false
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

[routes.direct-openrouter-flint-v1-0-free]
id = "direct-openrouter-flint-v1-0-free"
type = "passthrough"
target = "openrouter-flint-v1-0-free"
candidates = []
context_window = 262144
tool_calling = true
reasoning = true
vision = false


# =====================================================================
# Stephen direct routes - one addressable route per Stephen model
# =====================================================================
# Every Stephen model is reachable on its own, so it can be called directly,
# pinned in a client, or measured individually, instead of only existing as a
# leg inside a tier. These are leaves: a passthrough route names ONE target and
# declares no candidates, because its whole job is to expose exactly that model.
#
# NAMING - every Stephen route is `direct-openrouter-stephen-<model>`. The
# `stephen` token sits in one fixed position for all eight, so the set is
# contiguous when sorted and the credential is readable from the name alone.
#
# The primitives (ST_Tier1/2/3, ST_Paid) keep their own target+candidate
# ladder. The engine does NOT let a route reference another route, and nested
# composites are rejected at config load ("child routes must be leaves"), so the
# ladder is layered by responsibility rather than by reference:
#
#   direct-*  (one model, no fallback)
#     -> ST_Tier1/2/3 + ST_Paid  (ordered fallback within one capability class)
#       -> ST_Route              (composite; free tiers only, never ST_Paid)

[routes.direct-openrouter-stephen-deepseek-v4-1-flash]
id = "direct-openrouter-stephen-deepseek-v4-1-flash"
type = "passthrough"
target = "stephen-paid-deepseek-v4-1-flash"
candidates = []
context_window = 1048576
tool_calling = true
reasoning = true
vision = true
video = false

[routes.direct-openrouter-stephen-deepseek-v4-1-flash-1017]
