# One capability per physical model, so a caller chooses the model and each budget stays
# attached to the model that spends it.
#
# No `contract` is declared. A contract exists to say that two outputs are comparable — that
# is what it means for an embedding space — and audio from four different engines is not a
# shared space. The audio's measurable properties are declared instead, per capability:
# audio_format and audio_sample_rate, which the surface enforces on the response rather than
# asking the caller to trust them. Declaring a shared contract here would have claimed
# comparability that nothing verifies, and the loader's own uniqueness rule refused it
# outright, which is the right answer.
[capabilities.gemini-tts-2-5-flash]
id = "gemini-tts-2.5-flash"
target = "speech-2-5-flash"
voice = "Kore"
audio_format = "wav"
