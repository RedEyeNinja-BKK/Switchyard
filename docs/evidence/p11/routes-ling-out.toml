[quota]
state_dir = "/var/lib/switchyard/quota"

# Candidate: native Gemini decision leaf. A leaf over the existing
# direct-google-gemini-decision-1 target; no self-reference. Used inside the
# smart-decision capability_first composition; tier1-decision is unchanged.
[decision_lanes.smart-gemini-decision]
targets = ["direct-google-gemini-decision-1"]

# Candidate: local-first rerank with a third_party_free fallback.
[capabilities.smart-rerank]
id = "smart-rerank"
target = "reranker-local"
candidates = ["reranker-free"]
max_candidates = 64
top_n = 64
max_doc_chars = 1024
max_query_chars = 512

# Candidate: Gemini embedding alias over embedding-google2 (same space/client).
[capabilities.smart-gemini-embedding]
id = "smart-gemini-embedding"
target = "embedding-google2"
contract = "google-embedding-space:gemini-embedding-2-v1"
dimensions = 3072
normalization = "L2"
max_batch = 8
max_input_tokens = 8192
