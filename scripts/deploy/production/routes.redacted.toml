# Nemotron 3.5 Super VL is smartfree's R2 leg and its multimodal escalation.
# MEASURED 2026-11-11 on this free endpoint, per CARRIER:
#   * inline image (data: URL, 64px and 256px) -> 200, answered "Red"
#   * remote image URL -> 404 "No endpoints found that support image URLs"
#   * inline video (data: video/mp4) -> 200; remote video URL -> 404 "No endpoints
#     found that support video URLs"
# Video is TRUE with video_carrier = "inline": the carrier axis is what makes this
# declaration honest. It admits inline video, which this endpoint answers 200, and
# still refuses a remote video URL locally, which this endpoint answers with a
# terminal 404. The refusal names the carrier, not the modality.
[targets.openrouter-nemotron-3_5-super-vl-free]
id = "nvidia/nemotron-3.5-super-vl:free"
llm_client = "openrouter"
vision = true
video = true
video_carrier = "inline"
# Measured 2026-11-11: a data: image and a data: video return 200; a remote
# image_url and a remote video_url both return 404 "No endpoints found that support
# video URLs". The endpoint reads inline bytes only, for images as well as video, so
# the remote carrier must be refused here instead of forwarded into a provider 404.
image_carrier = "inline"
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

# Baidu ERNIE 5.5 Flash Preview, free tier. Measured 2026-11-11 through the
# Responses wire this deployment uses: plain 200, tool call 200 with a real
# function_call item, streaming 200, and image input rejected with
# "No endpoints found that support image input" (404). So it is declared
# text-only here -- no vision/video -- and route-level filtering keeps
# multimodal requests on the Nemotron candidate. Reasoning is emitted by
# default upstream, hence "enabled"/openrouter_enabled, matching how the other
# OpenRouter targets carry it.
[targets.openrouter-ernie-5_5-flash-preview-free]
id = "baidu/ernie-5.5-flash-preview:free"
llm_client = "openrouter"
# vision/video must be EXPLICIT false: an omitted capability is "undeclared" and
# the runner treats undeclared vision as permitted, so only an explicit refusal
# keeps image requests off this text-only target.
vision = false
video = false
tool_calling = true
reasoning_policy = "enabled"
reasoning_dialect = "openrouter_enabled"

