[composites.tier2-bounded]
children = ["smartfree-bounded", "smartlocal-bounded"]
context_window = 225280
tool_calling = true
reasoning = true
vision = true
video = true

# ---- decision targets and lanes ----
[targets.direct-htpc-laya]
id = "laya-rl-agent"
llm_client = "htpc"
decision_transport = "system_one"
decision_path = "/v1/systemone"
decision_base_url = "http://localhost:8011"
decision_api_key_env = "SWITCHYARD_LAYA_API_KEY"

[targets.direct-htpc-jev-style]
id = "jev-style-0.8b-decision-v3"
llm_client = "htpc"
decision_transport = "system_one"
decision_path = "/v1/systemone"
decision_base_url = "http://localhost:8765"
decision_api_key_env = "SWITCHYARD_JEV_STYLE_API_KEY"

[targets.direct-openrouter-span-01-lite]
id = "respan/span-01-lite"
llm_client = "openrouter"
decision_transport = "open_router_alpha"
decision_path = "/api/alpha/decisions"
decision_base_url = "https://openrouter.ai"
decision_api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"
supported_types = { noul = true, choice = false, score = false }
state_forms = { plain_string = true, structured = false }

[targets."direct-openrouter-mercury-decide-free"]
id = "inception/mercury-decide:free"
llm_client = "openrouter"
decision_transport = "system_one"
decision_base_url = "https://openrouter.ai/api"
decision_api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"

[targets."direct-openrouter-mercury-decide-free".supported_types]
noul = true
choice = true
score = true

[decision_lanes.smartfree-decision]
targets = ["direct-openrouter-span-01-lite", "direct-openrouter-mercury-decide-free"]

[decision_lanes.smartlocal-decision]
targets = ["direct-htpc-jev-style", "direct-htpc-laya"]

# tier1-decision COMPOSES the two policy lanes above. It does not copy
# their targets, so each family stays independently addressable and a
# family change is inherited rather than duplicated.
[decision_lane_composition.tier1-decision]
children = ["smartfree-decision", "smartlocal-decision"]

# ---- embeddings and reranking ----
[capability_clients.embedding-local]
format = "openai_embeddings"
base_url = "http://localhost:8448"
model = "Qwen3-Embedding-0.6B"

[capability_clients.embedding-free]
format = "openai_embeddings"
base_url = "https://openrouter.ai/api"
model = "liquid/lfm-2.5-embedding-350m:free"
api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"
timeout_seconds = 120

[capability_clients.reranker-local]
format = "cohere_jina_rerank"
base_url = "http://localhost:8449"
model = "qwen3-reranker-0.6b-q8_0"
timeout_seconds = 120

[capabilities.switchyard-embedding-local]
id = "switchyard-embedding-local"
target = "embedding-local"
contract = "localclaw-embedding-space:v1"
dimensions = 1024
normalization = "L2"
max_batch = 64

[capabilities.switchyard-embedding-free]
id = "switchyard-embedding-free"
target = "embedding-free"
contract = "localclaw-embedding-space:lfm2.5-350m-v1"
dimensions = 1024
normalization = "L2"
max_batch = 64

[capabilities.switchyard-rerank-local]
id = "switchyard-rerank-local"
target = "reranker-local"
max_candidates = 64
top_n = 64
max_doc_chars = 1024
max_query_chars = 512
