image_carrier = "inline"
route_reasoning_policy = "inherit"
# The measured learning carries over: the retired Ling took ~120 s on a 430k-token
# request while Nemotron handled it in ~50 s, so above 200k tokens the proven
# wide-context leg is offered first instead of the narrow one being tried and failing.
