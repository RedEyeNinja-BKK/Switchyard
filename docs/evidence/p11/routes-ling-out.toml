# ---- prime primitives ----
# `smart`: DeepSeek Flash at rank 1, Tencent Hy4 Flash as the metered failover, per the
# owner's 2026-11-25 correction. The former GLM and Qwen peers are removed from THIS
# route only; their targets and direct aliases stay registered and addressable, so no
# unrelated consumer loses a model.
#
# Hy4 is a terminal TIER rather than a candidate, deliberately. A candidate is a peer:
# with declared order it would still be consulted after DeepSeek failed for ANY reason,
# including a malformed request or a refused balance. A terminal tier under
# `terminal_policy = "availability"` is spendable only on allowance exhaustion, a closed
# minute window, a 429, a retryable 5xx, a transport fault, an unavailable leg or an
# attempt timeout -- so a defect in the request never becomes a paid call.
#
# Advertised context is 1000000 (owner). Both legs hold far more than that, so the
# promise is conservative rather than aspirational. Turnstone keeps its own 262144 on
# this alias by the owner's decision and is NOT widened here.
[routes.smart]
id = "smart"
type = "passthrough"
target = "deepseek-deepseek-flash"
candidates = []
terminal_fallback = [["openrouter-tencent-hy4-flash"]]
terminal_policy = "availability"
context_window = 1000000
tool_calling = true
reasoning = true
vision = true
route_reasoning_policy = "inherit"

# ---------------------------------------------------------------------
# smart-nt: equal primary groups, then local, then the metered terminal
# ---------------------------------------------------------------------
# The primary pool is two GROUPS of unequal size: smart-gemini-bounded holds four Google
# leaves and smart-openai-nt holds the OpenAI subscription leaf. Grouping is what keeps the
# four leaves from being four votes: the group is chosen before any leaf fact, so a group's
# leaf count cannot become provider priority and a countable Google daily budget cannot
# outrank an allowance this deployment cannot count.
#
# The primary groups are EQUAL, not a sequence. Order between them follows readiness, measured
# completion rate and measured latency, with a rotation floor when the evidence cannot separate
# them: no fixed 50/50 split and no mandatory Google-first ranking.
#
# `terminal_policy = "allowance_only"` is what the walk out of the pool is judged by: the
# local tier is entered only when BOTH primary allowance domains are EXHAUSTED, on the
# provider's own accounting. The strict reading is deliberate. `quota_only` also accepted a
# closed minute window and a bare 429, and those are not exhaustion: the minute regains room
# by itself, and an unclassified 429 may be a concurrency limit or a policy answer. It also
# means no untried sibling can be explained away by another leg's failure, because exhaustion
# is not credential-scoped -- every capable, unblocked primary leg must have been attempted
# and must have reported exhaustion.
#
# The metered NT terminal behind the local tier carries its own boundary ("availability"),
# because it exists for the case where the allowance is exhausted AND the local tier has no
# eligible capacity. A rejected credential, a refused balance, a context-window refusal, an
# empty answer or a policy 400 opens neither: those are facts about the deployment or the
# request.
[routes.smart-nt]
id = "smart-nt"
type = "passthrough"
target = "direct-google-gemini-3.5-flash-lite"
candidates = [
    "direct-google-gemini-3.1-flash-lite",
    "direct-google-gemma-4-31b-it",
    "direct-google-gemma-4-26b-a4b-it",
    "openai-gpt-6-luna-nt",
]
selection = "grouped"
pool_groups = ["smart-gemini-bounded", "smart-openai-nt"]
# Local and metered stay OUT of the ranked pool. A terminal leg written as a candidate would
# be ranked with its peers and would serve whenever the pool was busy, which is the escalation
# this route exists to prevent; naming it here means the exhaustion rule is the only way in.
terminal_fallback = [
    ["htpc-qwen3_5-9b-mtp-nt"],
    ["deepseek-deepseek-flash-nt"],
]
terminal_policy = "allowance_only"
# One value per tier, and `terminal_policies[i]` governs the boundary LEAVING tier i: the
# route-level policy above decides entry into tier 1, and this list decides whether tier 2 may
# be consulted once tier 1 failed. So the local tier is entered on allowance evidence only, and
# the metered tier is entered when local itself fails for a capacity reason -- a local outage is
# not allowance evidence, and demanding it there would leave tier 2 unreachable in practice
# while the "availability" value sat in a slot no walk ever reads.
terminal_policies = ["availability", "quota_only"]
context_window = 65536
tool_calling = true
reasoning = true
# vision stays false although the OpenAI primary group can read images. No image request has
# been measured through this route, and declaring the capability on the strength of a
# neighbour route's measurement would promise a path with no receipt. Recorded as a gap.
vision = false

# ---------------------------------------------------------------------
# smart-judge: equal primary groups, local only after the allowances are gone
# ---------------------------------------------------------------------
# A judge verdict is a short, strict-JSON answer over a bounded prompt. The lane is built from
# the two Gemma 4 targets the project serves inside its free allowance plus the OpenAI
# subscription leg, as two equal primary GROUPS: smart-gemini-judge (both Gemma target ids) and
# smart-openai-judge (the same Luna NT target smart-nt uses). Grouping keeps the two Gemma
# leaves from outvoting one OpenAI leaf, and keeps a countable Google budget from deciding the
# order between providers.
#
# The local no-thinking leg is the only terminal tier, entered when both primary allowance
# domains are exhausted with evidence. It is deliberately NOT a fit escalation: a prompt too
# large for a primary leg is refused with a typed fit refusal rather than routed to the local
# model, which is a loss of the previous fit-escalation behaviour and is disclosed as such.
#
# Advertised input ceiling is the binding target limit (16,000 TPM padded by 1,300 per mille),
# not the 262,144 model window: a judge prompt sized to the window would be refused by
# admission on every large verdict.
[routes.smart-judge]
id = "smart-judge"
type = "passthrough"
target = "direct-google-gemma-4-26b-a4b-it"
candidates = ["direct-google-gemma-4-31b-it", "openai-gpt-6-luna-nt"]
selection = "grouped"
pool_groups = ["smart-gemini-judge", "smart-openai-judge"]
terminal_fallback = [["htpc-qwen3_5-9b-mtp-nt"]]
terminal_policy = "allowance_only"
context_window = 12307
# The lane serves the judge's tool-bearing turns; a request that needs vision or a
# reasoning control is not this lane's work.
tool_calling = true
reasoning = false
vision = false
video = false

[routes.smartlocal]
id = "smartlocal"
type = "passthrough"
target = "htpc-qwen3_5-9b-mtp"
candidates = ["comfyninja-qwen3_8-27b-q4-mtp-vl"]
# Owner-set advertised maximum = the R2 escalation leg, NOT the R1 capacity.
# R1 (HTPC) still serves 81920 and the switch below is unchanged at >61440
# estimated input tokens. context_window is a projection here: a passthrough
# route performs no admission check against it, so this does not widen what
# the route will execute. No 152832-token request has been measured.
context_window = 152832
tool_calling = true
reasoning = true
vision = true
route_reasoning_policy = "medium"
escalation_max_input_tokens = 61440
escalation_target = "comfyninja-qwen3_8-27b-q4-mtp-vl"

[routes.smartlocal-nt]
id = "smartlocal-nt"
type = "passthrough"
target = "htpc-qwen3_5-9b-mtp"
candidates = ["comfyninja-qwen3_8-27b-q4-mtp-vl"]
# Same projection as smartlocal, with thinking disabled.
context_window = 152832
tool_calling = true
reasoning = true
vision = true
route_reasoning_policy = "none"
escalation_max_input_tokens = 61440
escalation_target = "comfyninja-qwen3_8-27b-q4-mtp-vl"

# r1 = ERNIE 5.5 Flash Preview (free), r2 = Nemotron 3.5 Super VL (free).
# Crouton Alpha was retired upstream on 2026-11-11 (its provider tombstone
# redirects to meta/muse-ember, which is PAID), so the free lane was rebuilt on
# two free models instead of one. ERNIE has the larger context (1,024,000) and
# is text-only; Nemotron is smaller (1,000,000) and carries the vision leg.
#
# 2026-11-19: `openrouter/free` is appended as the terminal leg on the GLOBAL
# credential, so a request still has an eligible zero-price model after the
# three named free models are exhausted. It spends the same account-wide free
# allowance and never pays; once that allowance is gone this route fails
# rather than escalating to a metered model. The
# route keeps context_window = 1000000 so both fit. Route::execute drops the
# text-only ERNIE target before dispatch, so an image request lands on Nemotron
# instead of being sent to a model that cannot read it. No paid model is ever a
# candidate.
#
# Vision is true because Nemotron serves INLINE images (data: URLs), proven live
# through this route on 2026-11-11 (driver logged model=nemotron, answer "Red").
# Remote image URLs are not fetchable on this free endpoint (upstream 404), so the
# route declares image_carrier = "inline". Video follows the same measurement:
# inline video is 200 on this endpoint family, remote video URL is 404, so the route
# declares video = true with video_carrier = "inline" and refuses a remote video URL
# locally instead of emitting a late provider 404.
[routes.smartfree]
id = "smartfree"
type = "passthrough"
target = "openrouter-ernie-5_5-flash-preview-free"
candidates = ["openrouter-nemotron-3_5-super-vl-free", "openrouter-openrouter-free"]
context_window = 1000000
tool_calling = true
reasoning = true
vision = true
video = true
video_carrier = "inline"
image_carrier = "inline"
route_reasoning_policy = "inherit"
# Under context pressure the wider, faster Nemotron leg is offered first. Ling
# was measured at ~120 s on a 430k-token request while Nemotron handled the same
# context in seconds; Ling was retired on 2026-11-28 and is no longer a member of
# this ladder. Below the threshold the owner's R1 ERNIE -> R3 Nemotron order stands.
escalation_max_input_tokens = 200000
escalation_target = "openrouter-nemotron-3_5-super-vl-free"
# Owner-approved free terminal (2026-11-26 direction): the OpenRouter free
# ladder above is unchanged and is tried first; only when every OR leg is
# ineligible or exhausted does the request reach the owner's Google free
# tier. It is a separate stage, not a fourth OR candidate, so the two
# accounts' daily counters are never conflated and a free->paid crossing is
# not created. Vision/video requests skip it: that target declares both
# false, and the terminal stage is subject to the same per-target fit test.
terminal_fallback = [["direct-google-gemini-3.5-flash-lite"]]
terminal_policy = "availability"


