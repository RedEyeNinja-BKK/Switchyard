]
# 262144 is this route's promise, not a limit any leg imposes: the leaf routes each
# carry their provider-published window (ERNIE 1,024,000; Nemotron
# 1,000,000). Raising this number is a separate, qualified decision about what ST_Free
# callers may be admitted with.
