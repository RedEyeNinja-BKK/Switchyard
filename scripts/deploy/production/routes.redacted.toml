# ---- decision lanes (order is configuration, from the requalification) ----
# ---- decision DIRECT foundations -> SMART families -> TIER policy ----
# No default_decision_lane is declared. The field only accepts a configured
# [decision_lanes.*] name, and the previous value named the COMPOSITION
# tier1-decision, which the binary rejects at load time. It sat inside a
# decision target's supported_types map, where it was inert. /v1/decisions
# requires an explicit `model`, so nothing falls back to a default lane.
[decision_lanes.smartfree-decision]
targets = ["direct-openrouter-span-01-lite"]

[decision_lanes.smartlocal-decision]
targets = ["direct-htpc-jev-style", "direct-htpc-laya"]

# GENERATED: tier1-decision COMPOSES the two SMART policy lanes above.
# It does not copy their targets, so each family stays independently
# addressable and a family change is inherited rather than duplicated.
[decision_lane_composition.tier1-decision]
children = ["smartfree-decision", "smartlocal-decision"]


[targets."direct-openrouter-stephen-span-01-lite"]
