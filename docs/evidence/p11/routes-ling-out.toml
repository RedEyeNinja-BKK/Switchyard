id = "nvidia/nemotron-3-ultra-550b-a55b:free"
llm_client = "openrouter_free"
# Read from the provider's own model record on 2026-11-27, not inferred from the
# paid row: the :free endpoint advertises text->text only, so vision and video are
# both refused here. tools and reasoning are in its supported_parameters
