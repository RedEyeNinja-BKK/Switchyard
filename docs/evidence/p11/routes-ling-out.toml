# budgets are declared now because a held lane that becomes serving must not become
# serving with an invented quota. Nothing can dispatch while the capability is held, so
# these limits cost nothing until qualification removes the hold.
#
# QUALIFIED 2026-11-22: the hold is lifted for text after four authenticated calls.
#
# Quota: the same owner-recorded limits as 001 — 100 RPM / 30,000 input TPM / 1,000 RPD —
# with the same caveat: rate ceilings at capture, not remaining allowance, and this
# deployment's counter is a local ledger rather than a provider balance.
[capability_clients.embedding-google2]
