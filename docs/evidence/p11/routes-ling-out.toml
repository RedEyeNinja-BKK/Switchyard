# ---------------------------------------------------------------------
# smart-route: the cost-efficiency ladder
# ---------------------------------------------------------------------
# Four GROUPS in a declared cost sequence, cheapest first:
#
#   smart-gemini-chat      Google free chat models, in quality order
#   smart-openrouter-free  OpenRouter free models
#   smart-deepseek-flash   DeepSeek Flash direct, which bills per call. SINGLE MEMBER:
#                          V4 Pro was removed from this ladder on 2026-11-27 and is not
#                          reachable from smart-route by any path.
#   smart-openrouter-paid  OpenRouter metered models, the most expensive leg
#
# `group_ordering = "ordered"` is what makes this a ladder rather than a peer set. The group
# index is the first ranking key and nothing measured outranks it, so a later group is never
# offered while an earlier one still has an eligible member; a ready free group cannot be
# displaced by a paid group that merely measures faster. Inside a group the leaf keys decide,
# so "best eligible model for this job" is still answered by evidence rather than by row order
# -- a member that cannot hold the request is skipped and its sibling answers.
#
# Why not `terminal_fallback`: a terminal tier is entered only by an exhaustion rule and is
# never ranked, which is the right shape for a last resort with a fixed boundary. Here the
# groups ARE the ladder, each with its own price, and the pool walk already tries every
# member of one group before the next. Writing the paid groups as terminal tiers instead
# would make the free OpenRouter and DeepSeek groups reachable only on exhaustion evidence,
# which is not what they are for -- they are the next cheapest thing to try, not a rescue.
#
# `capability_escalation` leaves with the terminal tiers it could reach. The measured case it
# covered -- every Google leg refusing a replayed function call for want of a provider
# signature -- is answered before dispatch by the `tool_call_replay` fact on each Google
# target, which skips a leg that cannot replay and lets the ladder advance on a fact rather
# than on a 400. Those targets now read `true`: each Gemini client declares Google's
# documented `skip_thought_signature_validator` stand-in for a call another model issued, so
# a request carrying foreign tool lineage is servable there instead of being skipped. A
# provider-discovered capability refusal on an undeclared field still has no dedicated
# terminal; it is reported as the caller's error, and that is recorded as a gap rather than
# papered over.
[routes.smart-route]
id = "smart-route"
type = "passthrough"
target = "direct-google-gemini-4-hydrogen"
candidates = [
    "direct-google-gemini-3.8-flash",
    "direct-google-gemini-3.6-flash",
    "openrouter-ernie-5_5-flash-preview-free",
    "openrouter-nemotron-3_5-super-vl-free",
    "deepseek-deepseek-flash",
    "openrouter-tencent-hy4-flash",
    "openrouter-glm-5_3-flash",
]
selection = "grouped"
group_ordering = "ordered"
pool_groups = [
    "smart-gemini-chat",
    "smart-openrouter-free",
    "smart-deepseek-flash",
    "smart-openrouter-paid",
]
context_window = 262144
tool_calling = true
reasoning = true
vision = false
video = false

[routes.smart-gemini-chat]
id = "smart-gemini-chat"
type = "passthrough"
target = "direct-google-gemini-4-hydrogen"
candidates = [
    "direct-google-gemini-3.8-flash",
    "direct-google-gemini-3.6-flash",
    "direct-google-gemini-3.5-flash-lite",
    "direct-google-gemini-3.1-flash-lite",
]
selection = "declared"
context_window = 262144
tool_calling = true
reasoning = true
vision = false
video = false

# Stage 2 as a route. Three named free models, in the owner's order. The older
