# (`Unsupported parameter: temperature`, HTTP 400) -- measured 2026-11-22, and the
# 400 was masking the leg's real 429 `usage limit has been reached`. The field is
# omitted so the provider default applies and the true outcome stays visible.
omit_body_fields = ["temperature"]
vision = true
extra_body = { store = false, stream = true }
reasoning_policy = "disabled"
reasoning_dialect = "openai_effort"

