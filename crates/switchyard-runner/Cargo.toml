[package]
name = "switchyard-runner"
version.workspace = true
description = "Configured routing execution for Switchyard serving surfaces"
authors.workspace = true
edition.workspace = true
homepage = "https://github.com/NVIDIA-NeMo/Switchyard"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[features]
prefill-router = ["dep:prefill-router"]

[dependencies]
hmac = "0.12"
libsy = { package = "switchyard-libsy", path = "../libsy", version = "0.3.0" }
parking_lot.workspace = true
prefill-router = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
switchyard-llm-client.workspace = true
switchyard-protocol.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
toml = "1.1"
tracing.workspace = true

switchyard-translation.workspace = true

[dev-dependencies]
async-trait.workspace = true
hmac = "0.12"
http.workspace = true
futures-util.workspace = true
sha2 = "0.10"
tokio.workspace = true
wiremock = "0.6"
