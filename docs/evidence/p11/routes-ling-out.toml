# ---------------------------------------------------------------------
# smart-nt-bounded-trial: the bounded contract under a name nobody calls
# ---------------------------------------------------------------------
# New name, deliberately. The live smart-nt alias keeps its current
# meaning, targets and reasoning policy until a consumer migration is
# accepted; this route exists so the contract can be reviewed and
# rehearsed without moving a consumer. (The older `smart-bounded` alias
# was retired and its route deleted; `smart-nt` is its successor.)
#
# ORDER: 3.5-flash-lite -> 3.1-flash-lite -> 3.6-flash -> 3.8-flash ->
#        2.5-flash -> 4-hydrogen -> gemma-4-26b -> gemma-4-31b ->
#        Luna-NT -> DeepSeek Flash-NT
#
# Expressed as a composite over whole child routes rather than a
# passthrough with three candidates, for one reason: legs 3 and 4 must
# keep the exact behaviour they have today. `direct-openai-gpt-6-luna-nt`
# and `direct-deepseek-deepseek-flash-nt` are the existing leaf routes, so
# the NT legs are not re-declared here and cannot drift from the aliases
# consumers already use. A passthrough would carry one
# route_reasoning_policy across all four legs, and "none" would be sent to
# Gemini, which cannot honour it.
#
# cross_on = "failure_class" because the four children sit on three
# different credentials (Google AI Studio, OpenAI Codex OAuth, DeepSeek).
# That is the historical rule for a credential-diverse ladder, and it is
# what VC_Paid above states for the same reason. A child whose credential
# is known exhausted is skipped without a provider call, so one dead
# credential is not re-dialled three times.
#
# WHAT CROSSES, MEASURED FROM THE CLASSIFIER RATHER THAN ASSUMED:
#   transport, timeout, rate limit, temporarily unavailable, 5xx,
#   account quota, retired model   -> next child
#   a spent DAILY BUDGET           -> next child, and no provider call is
#                                     made for the leg that is out
#   auth failure                   -> terminal, so a broken credential is
#                                     not silently answered by a paid leg
#
# One consequence worth stating plainly: a per-minute 429 is not
# distinguishable from a daily one at this layer, so a transient limit
# advances the chain. The local daily budget is the control that bounds
# spend; it is why both Gemini targets declare one.
#
# context_window = 262144 matches the promise smart-nt already makes, so a
# later consumer migration would not silently widen or narrow what a caller
# may send.

