# Switchyard V6 release candidate. Generated and validated; do not hand-edit.
schema_version = 1

[llm_clients.deepseek]
format = "openai_responses"
base_url = "https://api.deepseek.com"
locality = "external"
api_key_env = "SWITCHYARD_DEEPSEEK_API_KEY"
max_retries = 2

[llm_clients.deepseek_nt]
format = "openai_responses"
base_url = "https://api.deepseek.com"
locality = "external"
api_key_env = "SWITCHYARD_DEEPSEEK_API_KEY"
max_retries = 2

[llm_clients.htpc]
format = "openai_responses"
base_url = "http://htpc-wsl.tailc8ef7b.ts.net:8889/v1"
locality = "local"
api_key_env = "SWITCHYARD_HTPC_API_KEY"
max_retries = 2

billing = "local"

# The no-thinking local leg. Same transport as `htpc`, separate client on purpose: the loader
# refuses two targets that name one model on one client with different reasoning policies, and
# the third tier exists precisely because the thinking leg's budget is the reason it cannot
# answer a strict-JSON verdict in time.
[llm_clients.htpc-nt]
format = "openai_responses"
base_url = "http://htpc-wsl.tailc8ef7b.ts.net:8889/v1"
locality = "local"
api_key_env = "SWITCHYARD_HTPC_API_KEY"
max_retries = 2
billing = "local"
# One physical machine, one account. Both HTPC clients reach the same server and the same
# weights, so the accounting unit is the machine rather than the client entry.
quota_group = "htpc"

[llm_clients.thaillm]
format = "openai_responses"
base_url = "https://thaillm.or.th/api/v1"
locality = "external"
api_key_env = "SWITCHYARD_THAILLM_API_KEY"
max_retries = 2

[llm_clients.openai]
format = "openai_responses"
base_url = "https://chatgpt.com/backend-api/codex"
locality = "external"
api_key_env = "SY_OPENAI_OAUTH_TOKEN"
requires_list_input = true
max_retries = 2

[llm_clients.openai_nt]
format = "openai_responses"
base_url = "https://chatgpt.com/backend-api/codex"
locality = "external"
api_key_env = "SY_OPENAI_OAUTH_TOKEN"
requires_list_input = true
max_retries = 2

[llm_clients.openrouter]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
locality = "external"
api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"
max_retries = 2

# The owner OpenRouter account's FREE-model domain.
#
# Same credential as the paid client above -- one account, one key -- and a different quota
# domain. Every target whose model is a :free slug bills against the account's free-model
# daily cap, which the provider reports as ONE figure for the whole account. Leaving those
# targets on the paid client would leave that cap uncounted; here, under an account-scoped
# counter, the cap is counted once and enforced once.
#
# A separate client rather than a quota_group on the paid client, because
# with_daily_allowances attaches a client's account counter to every target it serves: a
# group there would gate the paid glm/qwen/hy4 targets on the free-model ceiling.
[llm_clients.openrouter_free]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
locality = "external"
api_key_env = "SWITCHYARD_OPENROUTER_API_KEY"
max_retries = 2
quota_group = "openrouter-free-owner"
quota_scope = "account"
quota_reset = "utc"
quota_provider = "openrouter_free_models"

[llm_clients.comfyninja]
format = "openai_responses"
base_url = "https://reninja.tailc8ef7b.ts.net:8446/v1"
locality = "local"
api_key_env = "SWITCHYARD_COMFYNINJA_API_KEY"
max_retries = 2

