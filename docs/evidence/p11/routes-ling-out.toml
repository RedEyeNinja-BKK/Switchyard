# Google's own embedding model, on the GEMINI credential. This ADAPTER sends one content
# per request: model named in the path, key presented as x-goog-api-key. A batch is a
# bounded fan-out of single-input calls, so max_batch below is a call budget rather than a
# payload limit.
#
# Google's API does have bulk forms — synchronous `:batchEmbedContents` (a `requests`
# array) and an asynchronous Batch API. Neither is used here: their entitlement on this
# Free project and their response shapes are unqualified, and a fan-out that already
# preserves input order does not need a second, unproven wire. That is a decision about
# this adapter, not a statement about what Google supports.
#
# No task_type is declared, which asks for the model's generic space. RETRIEVAL_DOCUMENT
# and RETRIEVAL_QUERY each produce a DIFFERENT space, so either would need its own
# capability id and its own contract rather than being switched underneath this one.
#
# Quota: 100 RPM / 30,000 input TPM / 1,000 RPD are the owner's Free-tier LIMITS for this
# physical model, taken from the owner's AI Studio record and recorded in
# docs/evidence/gemini-r3/2026-11-21/OWNER-CONTROLLING-ALL-FREE-CAPABILITIES.md (the 26-row
# table, columns RPM / input TPM / RPD). They are enforced per physical call.
#
# Those denominators are rate CEILINGS for the account, project and tier at capture, not
# remaining allowance, and this deployment's own counter is not a provider balance: the
# ledger records what this process spent today, which is a lower bound on what the project
# spent. They are also project- and model-scoped, so 1,000 is not a share of one combined
# daily pool shared with the chat models. Minute and day counters are keyed on (quota group,
# physical model) and charged once per physical call, so a 16-input batch spends 16 of the
# day's 1,000.
[capability_clients.embedding-google]
format = "google_embed_content"
base_url = "https://generativelanguage.googleapis.com"
model = "gemini-embedding-001"
api_key_env = "SWITCHYARD_GEMINI_API_KEY"
timeout_seconds = 120
quota_group = "google-ai-studio-free"
requests_per_minute = 100
input_tokens_per_minute = 30000
daily_request_limit = 1000

# The Embedding 2 client. Its own counters, independent of 001 — two different physical
